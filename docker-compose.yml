services:
    pocketbase:
        build:
            context: .
            dockerfile: Dockerfile.pocketbase
        env_file: apps/api/.env
        ports:
            - "3435:8090"
        volumes:
            - ./pocketbase/data:/pb_data

    api:
        build:
            context: .
            dockerfile: Dockerfile.api
        ports:
            - "3434:3434"
        env_file: apps/api/.env
        depends_on:
            - pocketbase
        healthcheck:
            test: ["CMD", "curl", "-f", "http://localhost:3434/healthcheck"]
            interval: 30s
            timeout: 5s
            retries: 3
            start_period: 10s

    api-tunnel:
        image: tuns-tunnel:latest # built locally on the host from the tuns-tunnel repo
        pull_policy: never
        environment:
            - TUNS_NAME=noisehaus-api
            - TARGET_HOST=api
            - TARGET_PORT=3434
        depends_on:
            - api
        volumes:
            - /root/.ssh/tuns_ed25519:/root/.ssh/id_ed25519:ro
        restart: always

    pocketbase-tunnel:
        image: tuns-tunnel:latest # built locally on the host from the tuns-tunnel repo
        pull_policy: never
        environment:
            - TUNS_NAME=noisehaus-pocketbase
            - TARGET_HOST=pocketbase
            - TARGET_PORT=8090
        depends_on:
            - pocketbase
        volumes:
            - /root/.ssh/tuns_ed25519:/root/.ssh/id_ed25519:ro
        restart: always
