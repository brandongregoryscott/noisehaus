services:
    pocketbase:
        image: ghcr.io/muchobien/pocketbase:0.38
        env_file: apps/api/.env
        command:
            [
                "serve",
                "--http=0.0.0.0:8090",
                "--dir=/pb_data",
                "--migrationsDir=/pb_migrations",
            ]
        ports:
            - "3435:8090"
        volumes:
            - ./pocketbase/migrations:/pb_migrations
            - ./pocketbase/data:/pb_data

    api:
        build:
            context: .
            dockerfile: Dockerfile.api
        ports:
            - "3434:3434"
        env_file: apps/api/.env
        depends_on:
            - pocketbase
        healthcheck:
            test: ["CMD", "curl", "-f", "http://localhost:3434/healthcheck"]
            interval: 30s
            timeout: 5s
            retries: 3
            start_period: 10s

    api-tunnel:
        build:
            context: .
            dockerfile: Dockerfile.tunnel
        depends_on:
            - api
        volumes:
            - /home/brandon/.ssh/id_ed25519:/root/.ssh/id_ed25519:ro
        restart: always

    pocketbase-tunnel:
        build:
            context: .
            dockerfile: Dockerfile.tunnel
            args:
                SUBDOMAIN: noisehaus-pocketbase
                REMOTE_PORT: "80"
                LOCAL_HOST: pocketbase
                LOCAL_PORT: "8090"
        depends_on:
            - pocketbase
        volumes:
            - /home/brandon/.ssh/id_ed25519:/root/.ssh/id_ed25519:ro
        restart: always
