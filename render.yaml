services:
    - type: web
      name: noisehaus-web

      autoDeploy: true
      branch: main
      buildCommand: npm ci && npm run build --workspace=apps/web
      pullRequestPreviewsEnabled: true
      runtime: static
      staticPublishPath: apps/web/dist
      envVars:
          - key: VITE_API_URL
            value: https://bscott-noisehaus-api.tuns.sh
      routes:
          - type: rewrite
            source: /*
            destination: /index.html