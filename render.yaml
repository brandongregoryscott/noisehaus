services:
    - type: web
      name: noisehaus-web

      autoDeploy: true
      branch: main
      buildCommand: npm install && npm run build
      pullRequestPreviewsEnabled: true
      rootDir: apps/web
      runtime: static
      staticPublishPath: out
      envVars:
          - key: VITE_API_URL
            value: https://bscott-noisehaus-api.tuns.sh
